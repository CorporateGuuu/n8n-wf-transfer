[project]
name = "ops-intelligence"
version = "0.1.0"
description = "Synthetic multi-tenant operations intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "argon2-cffi>=23,<26",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-q"
markers = ["postgres: requires TEST_POSTGRES_URL and a migrated PostgreSQL database"]
