name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - name: Install pinned Python static security scanner
        run: pip install bandit==1.9.4
      - name: Static security scan of API runtime code
        run: bandit -r apps/api/app --severity-level medium --confidence-level all --ignore-nosec
      - run: pytest -m 'not postgres'
      - run: python scripts/export_openapi.py --check
      - run: DATABASE_URL=sqlite+pysqlite:///./ci.db alembic upgrade head

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops -d ops_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ops:ops@localhost:5432/ops_intelligence
      TEST_POSTGRES_URL: postgresql+psycopg://ops:ops@localhost:5432/ops_intelligence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: alembic upgrade head
      - run: pytest -m postgres
      - name: Rehearse synthetic PostgreSQL backup and restore
        env:
          PYTHONPATH: apps/api
          APP_ENV: test
        run: python scripts/verify_postgres_restore.py > postgres-restore-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-restore-rehearsal
          path: postgres-restore-report.json

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Inventory installed frontend dependencies
        uses: anchore/sbom-action@v0
        with:
          path: apps/web
          format: spdx-json
          output-file: web-installed.spdx.json
          artifact-name: ops-intelligence-web-installed.spdx.json
          upload-release-assets: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frontend inventory coverage
        working-directory: .
        run: python scripts/validate_runtime_sbom.py web-installed.spdx.json --scope frontend

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  apigee-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Apigee reference bundle
        run: python scripts/validate_apigee.py

  platform-gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - name: Helm lint
        run: helm lint deploy/helm/ops-intelligence
      - name: Helm render
        run: helm template portfolio deploy/helm/ops-intelligence > /tmp/ops-intelligence.yaml
      - name: Validate GitOps reference
        run: python scripts/validate_gitops.py
      - name: Public-safety secret scan
        run: python scripts/security_scan.py
      - name: Build API container
        run: docker build -f docker/api.Dockerfile -t ops-intelligence-api:ci .

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: ops-intelligence-sbom.spdx.json
          upload-release-assets: false

  iac-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          skip_check: CKV2_AWS_5
          quiet: false

  finops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate FinOps controls
        run: python scripts/validate_finops.py

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy filesystem discovery scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t ops-intelligence-api:scan .
      - name: Inventory the built API runtime
        uses: anchore/sbom-action@v0
        with:
          image: ops-intelligence-api:scan
          format: spdx-json
          output-file: api-runtime.spdx.json
          artifact-name: ops-intelligence-api-runtime.spdx.json
          upload-release-assets: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify API runtime inventory coverage
        run: python scripts/validate_runtime_sbom.py api-runtime.spdx.json
      - name: Trivy container discovery scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ops-intelligence-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'
