apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-intelligence-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CorporateGuuu/n8n-wf-transfer.git
    targetRevision: main
    path: deploy/helm/ops-intelligence
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ops-intelligence-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
